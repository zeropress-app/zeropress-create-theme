<!doctype html>
<html lang="{{site.locale}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{partial:theme-init}}
    <title>{{meta.title}}</title>
    <meta name="theme-color" content="#f8f4ed">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/assets/style.css">
    {{meta.head_tags}}
  </head>
  <body class="theme-body">
    <a class="skip-link" href="#content">Skip to content</a>
    {{slot:header}}
    <main id="content" class="site-main">
      {{slot:content}}
    </main>
    {{slot:footer}}
    {{#if site.search.enabled}}
      <div class="cmdk" data-cmdk hidden>
        <div class="cmdk__backdrop" data-cmdk-close></div>
        <div class="cmdk__panel" role="dialog" aria-modal="true" aria-label="Search writing">
          <div class="cmdk__field">
            <span class="cmdk__icon" aria-hidden="true">⌕</span>
            <input
              type="search"
              data-cmdk-input
              role="combobox"
              aria-label="Search writing"
              aria-expanded="false"
              aria-controls="cmdk-results"
              aria-autocomplete="list"
              placeholder="Search writing..."
              autocomplete="off"
              spellcheck="false"
            >
            <kbd class="cmdk__kbd">esc</kbd>
          </div>
          <ul class="cmdk__list" id="cmdk-results" role="listbox" aria-label="Search results" data-cmdk-list></ul>
          <p class="cmdk__empty" data-cmdk-empty hidden>Type to search.</p>
        </div>
      </div>
    {{/if}}
  </body>
</html>
