<header class="site-header">
  <div class="shell site-header__inner">
    <div class="header-top">
      <div class="header-brand">
        <a class="site-title-link" href="/">
          <span class="site-title">{{site.title}}</span>
        </a>
        <p class="site-subtitle">{{site.description}}</p>
      </div>
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="Toggle color theme">🌙</button>
    </div>

    <div class="header-bottom">
      <nav class="site-nav" aria-label="Main navigation">
        {{menu:primary}}
      </nav>

      {{#if site.search.enabled}}
        <div class="header-search">
          <div class="search-theme-wrapper">
            <button class="search-open-button" type="button" data-cmdk-open aria-label="Search writing" disabled>
              <span aria-hidden="true">⌕</span>
              <span>Search writing</span>
              <kbd>/</kbd>
            </button>
          </div>
        </div>
      {{/if}}
    </div>
  </div>
</header>
