<script>
  (function () {
    var root = document.documentElement;
    // Reserve the enhanced menu layout while theme.js loads. If it cannot run,
    // release the pending state so CSS exposes every navigation link.
    root.classList.add("nav-pending");
    if (typeof HTMLDialogElement !== "undefined" &&
        typeof HTMLDialogElement.prototype.showModal === "function") {
      root.classList.add("mobile-nav-pending");
    }
    document.addEventListener("DOMContentLoaded", function () {
      root.classList.remove("nav-pending", "mobile-nav-pending");
    }, { once: true });

    try {
      var savedTheme = null;
      try {
        var storage = window.localStorage;
        savedTheme = storage && storage.getItem("zeropress-theme");
      } catch (error) {
        // Storage is optional; preserve the system preference when unavailable.
      }
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    } catch (error) {
      document.documentElement.setAttribute("data-theme", "light");
      document.documentElement.style.colorScheme = "light";
    }
  }());
</script>
<script defer src="/assets/theme.js"></script>
