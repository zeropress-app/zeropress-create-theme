<div class="shell page-shell">
  <article class="article-shell article-shell--page">
    <header class="article-header">
      <p class="eyebrow">Page</p>
      <h1>{{page.title}}</h1>
    </header>
    <div class="article-content prose-blog" {{#if site.search.enabled}}{{#if_neq page.discoverability "delist"}}data-pagefind-body{{/if}}{{/if}}>{{page.html}}</div>
    {{#if comments.enabled}}
      {{partial:comments-island}}
    {{/if}}
  </article>
</div>
