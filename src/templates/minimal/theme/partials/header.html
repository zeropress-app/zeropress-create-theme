<header class="site-header">
  <div class="site-container site-header__inner">
    <a class="site-brand" href="/">{{site.title}}<span aria-hidden="true">.</span></a>
    <div class="site-header__navigation">
      <nav class="site-nav" aria-label="Main navigation">
        {{menu:primary}}
      </nav>
      {{#if site.search.enabled}}
        <button class="search-open" type="button" data-search-open aria-haspopup="dialog" aria-controls="site-search" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <span>Search</span>
        </button>
      {{/if}}
    </div>
  </div>
</header>
